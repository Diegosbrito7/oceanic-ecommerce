<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OCEANIC | Crear cuenta</title>

    <!-- Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap" rel="stylesheet">

    <!-- Estilos -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/register.css">
</head>

<body>

    <header class="register-header">
        <a href="index.html" class="logo">OCEANIC</a>
    </header>

    <main class="register-main">

        <section class="register-card">

            <h1>Crear cuenta</h1>

            <p class="register-description">
                ¡Sumate a OCEANIC y descubrí nuestra colección!
            </p>

            <form>

                <div class="register-fields">

                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre"
                            placeholder="Ingresá tu nombre"
                            minlength="3" maxlength="40" required>
                    </div>

                    <div class="form-group">
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" name="apellido"
                            placeholder="Ingresá tu apellido"
                            minlength="3" maxlength="40" required>
                    </div>

                    <div class="form-group">
                        <label for="usuario">Nombre de usuario</label>
                        <input type="text" id="usuario" name="usuario"
                            placeholder="Elegí un nombre de usuario"
                            minlength="4" maxlength="20" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" name="email"
                            placeholder="Ingresá tu correo electrónico" required>
                    </div>

                    <div class="form-group">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" name="telefono"
                            placeholder="Ingresá tu teléfono" 
                             minlength="10" maxlength="15" required>
                    </div>

                    <div class="form-group">
                        <label for="domicilio">Domicilio</label>
                        <input type="text" id="domicilio" name="domicilio"
                            placeholder="Ingresá tu domicilio"
                            minlength="5" maxlength="100" required>
                    </div>

                    <div class="form-group">
                        <label for="codigo-postal">Código postal</label>
                        <input type="text" id="codigo-postal" name="codigo-postal"
                            placeholder="Ingresá tu código postal"
                            minlength="4" maxlength="10" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password"
                            placeholder="Creá tu contraseña"
                            minlength="8" maxlength="12" required>
                    </div>

                </div>

                <button type="submit" class="register-button">
                    REGISTRARME
                </button>

            </form>

            <p class="login-link">
                ¿Ya tenés una cuenta?
                <a href="login.html">Iniciá sesión</a>
            </p>

        </section>

    </main>

    <footer class="register-footer">
        <p>© 2026 OCEANIC | Indumentaria y accesorios</p>
    </footer>

</body>
</html>
